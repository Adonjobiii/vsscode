<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PathWise - Engineering Interests</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #f8fafc;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: -1;
    }

    .glass {
      background: rgba(20, 30, 48, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .question-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .question-card:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out, transform 8s linear;
      transform: scale(1.05);
    }

    .active-slide {
      opacity: 1;
      transform: scale(1);
    }

    /* Modern Radio Beans */
    .rating-bean {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input[type="radio"] {
      display: none;
    }

    input[type="radio"]:checked+.rating-bean {
      background-color: #10b981;
      border-color: #10b981;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      font-weight: bold;
    }

    .rating-bean:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

<body class="h-screen w-screen font-sans">
  <div class="h-screen w-full flex items-center justify-center p-4 md:p-8">

    <!-- Centered Form Section -->
    <div
      class="w-full max-w-4xl glass rounded-2xl flex flex-col relative overflow-hidden h-full max-h-[900px] p-8 md:p-12 shadow-2xl">
      <!-- Glow effects -->
      <div
        class="absolute top-0 right-0 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none">
      </div>
      <div
        class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-cyan-500/10 rounded-full blur-[100px] pointer-events-none">
      </div>

      <div class="relative z-10 flex flex-col h-full">

        <div class="flex justify-between items-start mb-6">
          <div class="flex items-center gap-4">
            <div
              class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center font-bold text-slate-900 text-2xl shadow-lg shadow-emerald-500/30">
              2</div>
            <div>
              <h1 class="text-3xl font-bold tracking-tight text-white mb-1">Engineering Interests</h1>
              <p class="text-slate-400">Tell us what professional tasks excite you the most.</p>
            </div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="mb-8 glass p-4 rounded-xl">
          <div class="flex justify-between items-center mb-2">
            <p class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Assessment Flow</p>
            <span
              class="text-xs font-bold text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-white/5">Step 2
              of 4</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-2 border border-white/5">
            <div class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-2 rounded-full relative" style="width: 50%">
              <div
                class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-[0_0_10px_rgba(52,211,153,0.8)]">
              </div>
            </div>
          </div>
        </div>

        <!-- Step 2: Tasks Ratings -->
        <div class="flex justify-between items-end mb-4 px-2">
          <p class="font-bold text-white text-lg">Rate your interest</p>
          <div class="flex gap-2 text-xs text-slate-400 uppercase tracking-wider font-bold">
            <span class="bg-slate-800 px-2 py-1 rounded">1 = Low</span>
            <span class="bg-slate-800 px-2 py-1 rounded">5 = High</span>
          </div>
        </div>

        <div id="tasks-container" class="flex-grow flex flex-col gap-4 text-slate-300 overflow-y-auto pr-2 pb-4">
          <div class="text-center py-10 glass rounded-xl">Hold on, fetching your customized assessment...</div>
        </div>

        <div class="mt-6 pt-6 border-t border-white/10 shrink-0">
          <button id="submit-btn"
            class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-xl py-4 hover:scale-[1.01] transition-transform duration-200 flex items-center justify-center text-lg font-bold shadow-lg shadow-emerald-500/25 gap-2"
            onclick="submitRatings()">
            Launch Aptitude Challenge
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z">
              </path>
            </svg>
          </button>
          <div id="error-message" class="text-rose-400 text-sm mt-3 text-center hidden font-medium">Please answer all
            questions before proceeding.</div>
        </div>

      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    let numTasks = 0;

    async function fetchTasks() {
      try {
        const response = await fetch('/api/engineering_tasks');
        const data = await response.json();

        const container = document.getElementById("tasks-container");
        container.innerHTML = "";

        numTasks = data.tasks.length;

        data.tasks.forEach((task, index) => {
          const taskDiv = document.createElement("div");
          taskDiv.className = "question-card p-6 rounded-2xl flex flex-col gap-4";

          const label = document.createElement("p");
          label.className = "font-bold text-lg text-white leading-tight";
          label.innerHTML = `<span class="text-emerald-400 mr-2">${index + 1}.</span> ${task}`;
          taskDiv.appendChild(label);

          const optionsDiv = document.createElement("div");
          optionsDiv.className = "flex justify-between items-center mt-2 w-full max-w-sm mx-auto";

          for (let i = 1; i <= 5; i++) {
            const lbl = document.createElement("label");
            lbl.className = "relative flex-1 text-center";
            lbl.innerHTML = `
               <input type="radio" name="task_${index}" value="${i}">
               <div class="rating-bean w-12 h-12 rounded-full text-slate-400 font-semibold bg-slate-800/50 hover:text-white mx-auto">${i}</div>
            `;
            optionsDiv.appendChild(lbl);
          }

          taskDiv.appendChild(optionsDiv);
          container.appendChild(taskDiv);
        });

      } catch (err) {
        console.error("Error fetching tasks:", err);
      }
    }

    async function submitRatings() {
      const errDiv = document.getElementById("error-message");
      errDiv.classList.add("hidden");

      const ratings = [];
      for (let i = 0; i < numTasks; i++) {
        const selectedOption = document.querySelector(`input[name="task_${i}"]:checked`);
        if (!selectedOption) {
          errDiv.textContent = "Please rate all tasks before continuing.";
          errDiv.classList.remove("hidden");
          return;
        }
        ratings.push(parseInt(selectedOption.value));
      }

      try {
        const response = await fetch('/api/recommend_stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ratings: ratings })
        });

        const result = await response.json();
        if (response.ok) {
          // Success! Go to Aptitude Test
          window.location.href = "assesment.html";
        } else {
          errDiv.textContent = result.error || "An error occurred.";
          errDiv.classList.remove("hidden");
        }
      } catch (err) {
        errDiv.textContent = "Failed to submit ratings.";
        errDiv.classList.remove("hidden");
      }
    }

    // Load tasks on page load
    window.onload = fetchTasks;

    let slides = document.querySelectorAll(".slide");
    let index = 0;

    function showSlide() {
      slides.forEach((slide, i) => {
        slide.classList.remove("active-slide");
        if (i === index) slide.classList.add("active-slide");
      });
      index = (index + 1) % slides.length;
    }

    setInterval(showSlide, 4000);
  </script>
</body>

</html>
