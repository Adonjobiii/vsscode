<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathWise - Commerce Aptitude Assessment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1454165833742-27210b453617?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: -1;
        }

        .glass {
            background: rgba(20, 30, 48, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .answered {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9) !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3) !important;
            border-color: rgba(139, 92, 246, 0.6) !important;
            font-weight: 700 !important;
        }

        .hidden {
            display: none !important;
        }

        .option-lbl {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-lbl:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(96, 165, 250, 0.3);
            transform: translateX(4px);
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked+span {
            background: rgba(96, 165, 250, 0.15);
            border-color: #60a5fa;
            color: #60a5fa;
        }

        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen font-sans flex flex-col md:flex-row text-slate-100">

    <aside
        class="w-full md:w-72 glass-panel md:h-screen overflow-y-auto p-4 md:p-6 sticky top-0 flex flex-col gap-4 md:gap-6 z-40">
        <div class="flex items-center justify-between md:justify-start gap-3 border-b border-white/5 pb-3 md:pb-4">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-400 to-purple-500 flex items-center justify-center font-bold text-slate-900 shadow-lg shadow-violet-500/30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5">
                        </path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-white tracking-tight">Navigator</h2>
            </div>
            <div id="nav-container" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-2 gap-2"></div>
    </aside>

    <main
        class="flex-1 p-4 sm:p-8 md:p-12 overflow-y-auto relative min-h-screen md:h-screen flex flex-col max-w-5xl mx-auto w-full">
        <div
            class="flex justify-between items-center mb-6 md:mb-8 glass px-5 md:px-8 py-4 md:py-5 rounded-2xl sticky top-0 z-30">
            <div class="flex items-center gap-2 md:gap-4 text-left">
                <span
                    class="text-[10px] md:text-xs font-bold text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-white/5 uppercase tracking-widest hidden sm:inline-block">Step
                    3 of 4</span>
                <h1
                    class="text-lg md:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500 tracking-tight">
                    Banking & Finance</h1>
            </div>
            <div
                class="flex items-center gap-2 md:gap-3 bg-slate-800/80 px-3 md:px-4 py-1.5 md:py-2 rounded-xl border border-white/5 shadow-inner">
                <svg class="w-4 h-4 md:w-5 md:h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="timer" class="text-lg md:text-xl font-mono font-bold text-white tracking-wider">00:00</span>
            </div>
        </div>

        <div id="questions" class="flex-grow">
            <div class="flex flex-col items-center justify-center h-64 glass rounded-2xl" id="loading-text">
                <div class="w-10 h-10 border-4 border-blue-500/30 border-t-blue-500 rounded-full animate-spin mb-4">
                </div>
                <p class="text-slate-400 font-medium">Analyzing career paths...</p>
            </div>
        </div>

        <div id="finish-modal"
            class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center">
            <div
                class="glass max-w-sm w-full rounded-2xl p-8 transform scale-95 transition-transform duration-300 relative border border-white/10 shadow-2xl text-center flex flex-col items-center">
                <div class="w-16 h-16 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2 tracking-tight">Finalize Report?</h2>
                <p class="text-slate-400 text-sm mb-8 leading-relaxed">Submit your responses to generate the Commerce
                    career profile.</p>
                <div class="flex gap-4 w-full">
                    <button onclick="document.getElementById('finish-modal').classList.add('hidden')"
                        class="flex-1 py-3 rounded-xl font-bold text-slate-300 bg-slate-800 hover:bg-slate-700 border border-white/5">Wait</button>
                    <button onclick="submitTest()"
                        class="flex-1 bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-500/25">Submit</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentQuestion = 0;
        let questionsData = [];
        const answers = {};
        let startTime;
        let timerInterval;

        async function fetchQuestions() {
            try {
                const response = await fetch('/api/commerce_aptitude_questions');
                questionsData = await response.json();
                document.getElementById('loading-text').style.display = 'none';
                renderNav();
                renderQuestions();
                showQuestion(0);
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const diff = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('timer').textContent = `${Math.floor(diff / 60).toString().padStart(2, '0')}:${(diff % 60).toString().padStart(2, '0')}`;
                }, 1000);
            } catch (err) { console.error(err); }
        }

        function renderNav() {
            const nav = document.getElementById("nav-container");
            questionsData.forEach((q, idx) => {
                const btn = document.createElement("button");
                btn.id = `qbtn_${idx}`;
                btn.className = "w-full text-center px-2 py-2.5 rounded-xl border border-white/5 bg-slate-800/50 hover:bg-slate-700 transition-colors text-slate-300 font-medium text-xs";
                btn.textContent = `Q${idx + 1}`;
                btn.onclick = () => showQuestion(idx);
                nav.appendChild(btn);
            });
        }

        function renderQuestions() {
            const container = document.getElementById("questions");
            questionsData.forEach((q, idx) => {
                const div = document.createElement("div");
                div.id = `question_${idx}`;
                div.className = "glass p-8 md:p-10 rounded-2xl hidden fade-in";
                div.innerHTML = `
          <div class="flex items-center justify-between mb-6">
            <span class="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-lg text-sm font-medium">${q.category}</span>
            <button onclick="document.getElementById('finish-modal').classList.remove('hidden')" class="text-sm font-bold text-rose-400 hover:text-rose-300">Finish Early</button>
          </div>
          <h2 class="text-xl md:text-2xl font-semibold mb-8 text-white">${idx + 1}. ${q.q}</h2>
          <div class="flex flex-col gap-3">
            ${Object.entries(q.options).map(([k, v]) => `
              <label id="lbl_${idx}_${k}" onclick="selectAnswer(${idx}, '${q.category}', '${q.id}', '${k}')" class="flex items-center gap-4 p-4 rounded-xl border border-slate-600/50 bg-slate-800/30 cursor-pointer hover:border-blue-500/40 hover:bg-slate-700/40 transition-all select-none">
                <span id="circle_${idx}_${k}" class="w-9 h-9 rounded-full border-2 border-slate-500 flex-shrink-0 flex items-center justify-center font-bold text-sm text-slate-300">${k}</span>
                <span class="text-slate-200 text-base flex-1">${v}</span>
              </label>
            `).join('')}
          </div>
        `;
                container.appendChild(div);
            });
        }

        function selectAnswer(idx, cat, qid, val) {
            answers[`${cat}_${qid}`] = val;
            const navBtn = document.getElementById(`qbtn_${idx}`);
            navBtn.classList.add('answered');

            const q = questionsData[idx];
            Object.keys(q.options).forEach(k => {
                const lbl = document.getElementById(`lbl_${idx}_${k}`);
                const circle = document.getElementById(`circle_${idx}_${k}`);
                if (k === val) {
                    lbl.className = "flex items-center gap-4 p-4 rounded-xl border-2 border-blue-400 bg-blue-500/10 cursor-pointer transition-all select-none";
                    circle.className = "w-9 h-9 rounded-full border-2 border-blue-400 bg-blue-400 flex-shrink-0 flex items-center justify-center font-bold text-sm text-slate-900 transition-all";
                } else {
                    lbl.className = "flex items-center gap-4 p-4 rounded-xl border border-slate-600/50 bg-slate-800/30 cursor-pointer hover:border-blue-500/40 transition-all select-none";
                    circle.className = "w-9 h-9 rounded-full border-2 border-slate-500 flex-shrink-0 flex items-center justify-center font-bold text-sm text-slate-300";
                }
            });

            setTimeout(() => {
                let next = idx + 1;
                if (next >= questionsData.length) document.getElementById('finish-modal').classList.remove('hidden');
                else showQuestion(next);
            }, 500);
        }

        function showQuestion(idx) {
            document.querySelectorAll('#questions > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(`question_${idx}`).classList.remove('hidden');
            document.querySelectorAll('#nav-container button').forEach((b, i) => {
                if (i === idx) b.classList.add('ring-2', 'ring-purple-500');
                else b.classList.remove('ring-2', 'ring-purple-500');
            });
        }

        async function submitTest() {
            const res = await fetch('/api/submit_commerce_aptitude', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers })
            });
            if (res.ok) window.location.href = "personality.html";
        }

        window.onload = fetchQuestions;
    </script>
</body>

</html>
