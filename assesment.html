<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire Session</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .answered {
      background-color: #22c55e !important; /* Green when answered */
      color: white;
      font-weight: bold;
    }
    .hidden {
      display: none;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #374151; /* dark grey track */
    }
    ::-webkit-scrollbar-thumb {
      background-color: #4b5563; /* medium grey scrollbar */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: #6b7280; /* lighter grey on hover */
    }
  </style>
</head>
<body class="min-h-screen bg-gray-800 text-gray-100 flex">

  <!-- Left Sidebar for Question Menu -->
  <aside class="w-64 bg-gray-700 h-screen overflow-y-auto p-4 sticky top-0">
    <h2 class="text-xl font-bold mb-4 text-green-400">Question Navigator</h2>
    <div class="flex flex-col gap-2">
      <!-- 25 Questions as menu items vertically listed -->
      <script>
        for (let i = 1; i <= 25; i++) {
          document.write(`<button class='bg-gray-600 hover:bg-green-500 rounded-md py-2 px-4 text-left' id='qbtn${i}'>Question ${i}</button>`);
        }
      </script>
    </div>
  </aside>

  <!-- Right Main Content for Questions -->
  <main class="flex-1 p-8 overflow-y-auto">
    <h1 class="text-2xl font-bold text-green-400 mb-6">Questionnaire</h1>

    <!-- Question Containers -->
    <div id="questions">
      <div id="question1" class="bg-gray-700 p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-lg font-semibold mb-4">Q1. Which data structure uses FIFO order?</h2>
        <div class="flex flex-col gap-2">
          <label><input type="radio" name="q1" value="a"> Stack</label>
          <label><input type="radio" name="q1" value="b"> Queue</label>
          <label><input type="radio" name="q1" value="c"> Tree</label>
          <label><input type="radio" name="q1" value="d"> Graph</label>
        </div>
      </div>

      <div id="question2" class="bg-gray-700 p-6 rounded-lg shadow-lg mb-6 hidden">
        <h2 class="text-lg font-semibold mb-4">Q2. Who is known as the father of computers?</h2>
        <div class="flex flex-col gap-2">
          <label><input type="radio" name="q2" value="a"> Alan Turing</label>
          <label><input type="radio" name="q2" value="b"> Charles Babbage</label>
          <label><input type="radio" name="q2" value="c"> John von Neumann</label>
          <label><input type="radio" name="q2" value="d"> Bill Gates</label>
        </div>
      </div>

      <div id="question3" class="bg-gray-700 p-6 rounded-lg shadow-lg mb-6 hidden">
        <h2 class="text-lg font-semibold mb-4">Q3. Which planet is known as the Red Planet?</h2>
        <div class="flex flex-col gap-2">
          <label><input type="radio" name="q3" value="a"> Venus</label>
          <label><input type="radio" name="q3" value="b"> Jupiter</label>
          <label><input type="radio" name="q3" value="c"> Mars</label>
          <label><input type="radio" name="q3" value="d"> Saturn</label>
        </div>
      </div>

      <!-- Placeholder Questions 4 - 25 -->
      <script>
        for (let i = 4; i <= 25; i++) {
          document.write(`
            <div id='question${i}' class='bg-gray-700 p-6 rounded-lg shadow-lg mb-6 hidden'>
              <h2 class='text-lg font-semibold mb-4'>Q${i}. This is a sample placeholder question ${i}?</h2>
              <div class='flex flex-col gap-2'>
                <label><input type='radio' name='q${i}' value='a'> Option A</label>
                <label><input type='radio' name='q${i}' value='b'> Option B</label>
                <label><input type='radio' name='q${i}' value='c'> Option C</label>
                <label><input type='radio' name='q${i}' value='d'> Option D</label>
              </div>
            </div>`);
        }
      </script>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex justify-between mt-6">
      <button id="prevBtn" class="bg-gray-600 px-4 py-2 rounded hover:bg-gray-500">Previous</button>
      <button id="nextBtn" class="bg-green-600 px-4 py-2 rounded hover:bg-green-500">Next</button>
    </div>
  </main>

  <script>
    let currentQuestion = 1;
    const totalQuestions = 25;

    function showQuestion(num) {
      for (let i = 1; i <= totalQuestions; i++) {
        document.getElementById(`question${i}`).classList.add('hidden');
      }
      document.getElementById(`question${num}`).classList.remove('hidden');
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentQuestion < totalQuestions) {
        currentQuestion++;
        showQuestion(currentQuestion);
      }
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentQuestion > 1) {
        currentQuestion--;
        showQuestion(currentQuestion);
      }
    });

    // Mark question as answered when option selected
    document.addEventListener('change', (e) => {
      if (e.target.type === 'radio') {
        const qName = e.target.name;
        const qNum = qName.replace('q','');
        const btn = document.getElementById(`qbtn${qNum}`);
        if (btn) btn.classList.add('answered');
      }
    });
  </script>

</body>
</html>
